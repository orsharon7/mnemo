name: CI

on:
  push:
    branches: [dev-workflow, dev, main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  pull_request:
    branches: [dev-workflow, dev, main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Fetch Sparkle framework + tools
        run: bash scripts/fetch-sparkle.sh
      - name: make (build Mnemo.app)
        run: make
      - name: swift test (if Package.swift exists)
        run: |
          if [ -f Package.swift ]; then
            swift test --parallel
          else
            echo "No Package.swift yet — test target infra tracked in #52. Skipping."
          fi
