name: CI

on:
  push:
    branches: [dev-workflow, dev, main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  pull_request:
    branches: [dev-workflow, dev, main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version && xcodebuild -version
      - name: Fetch Sparkle framework + tools
        run: bash scripts/fetch-sparkle.sh
        continue-on-error: true
      - name: Swift build
        run: swift build -c debug
      - name: Swift test
        run: swift test --parallel
        continue-on-error: true
